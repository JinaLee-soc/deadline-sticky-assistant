<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Research Desk</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Research Desk</h1><nav></nav><select id="language" aria-label="Language / 언어"><option value="en">English</option><option value="ko">한국어</option></select></header>
<div id="error" role="alert" hidden></div><section id="welcome" hidden></section>
<main id="workspace"><section class="memo"><span id="pet" role="img" aria-label="Cat"></span><div><small id="reason"></small><p id="nag"></p><div id="reminder-actions"></div></div></section><div class="toolbar"><h2 id="heading"></h2><span id="metrics"></span><select id="sort" aria-label="Sort / 정렬"></select><button id="add"></button></div><form id="editor" hidden></form><section id="content"></section><p id="legend"></p><section class="chat"><h2 id="chat-title"></h2><small id="chat-disclaimer"></small><form id="chat-form"><input id="question" required maxlength="1000"><button id="send"></button></form><p id="answer" hidden></p></section></main><footer><span id="save-status" role="status"></span><span id="privacy"></span></footer>
<script src="model.js"></script><script src="strings.js"></script><script src="app.js"></script></body></html>
